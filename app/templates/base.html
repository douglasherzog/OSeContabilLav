<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}OS e Contabil — Lavanderia{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
    <nav class="sidebar">
        <div class="brand">
            <strong>Lavanderia Senhor dos Passos</strong>
            <small>Herzog Comercial LTDA</small>
        </div>
        <ul>
            <li><a href="{{ url_for('dashboard.index') }}">Painel</a></li>
            <li><a href="{{ url_for('clientes.list') }}">Clientes</a></li>
            <li><a href="{{ url_for('servicos.list') }}">Serviços</a></li>
            <li><a href="{{ url_for('os.list') }}">Ordens de Serviço</a></li>
            <li><a href="{{ url_for('caixa.list') }}">Caixa</a></li>
            <li><a href="{{ url_for('contas.ap_list') }}">Contas a Pagar</a></li>
            <li><a href="{{ url_for('contas.ar_list') }}">Contas a Receber</a></li>
            <li><a href="{{ url_for('configuracoes.index') }}">Configurações</a></li>
            <li><a href="{{ url_for('utilitarios.index') }}">Utilitários</a></li>
        </ul>
    </nav>
    <main class="content">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
